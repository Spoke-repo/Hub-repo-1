name: "spoke/app_service_module"
description: "Deploys an Azure App Service via the spoke Terraform module."

inputs:
  tfvars_path:
    description: "Path (in the calling spoke repo) to the terraform.tfvars for this module/environment."
    required: true
  environment:
    description: "nonprod or prod"
    required: true
  tf_action:
    description: "plan | apply | destroy"
    required: false
    default: "plan"
  working_directory:
    description: "Directory containing the terraform.tfvars for this module."
    required: true
  azure_client_id:
    required: true
  azure_tenant_id:
    required: true
  azure_subscription_id:
    required: true

runs:
  using: "composite"
  steps:
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # NEW: copies the module code from the hub into the spoke folder.
    # Remove this step if your .tf files are already in the spoke folder.
    - name: Copy module code
      shell: bash
      run: cp "${{ github.action_path }}"/*.tf "${{ inputs.working_directory }}/"

    # NEW: adds the backend block here, so you don't edit the module code.
    # Remove this step if your module .tf files already contain backend "azurerm" {}.
    - name: Add backend block
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        cat > backend.tf <<'EOF'
        terraform {
          backend "azurerm" {}
        }
        EOF

    # CHANGED: uses the storage account and builds the state file name from the folder
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: |
        COMP_PATH=$(echo "${{ inputs.working_directory }}" | sed -E "s#^(\./)?iac/${{ inputs.environment }}/##")
        echo "State file: ${COMP_PATH}.tfstate"
        terraform init -input=false \
          -backend-config="$GITHUB_WORKSPACE/iac/${{ inputs.environment }}/backend.hcl" \
          -backend-config="key=${COMP_PATH}.tfstate"

    - name: Terraform Plan
      if: ${{ inputs.tf_action == 'plan' || inputs.tf_action == 'apply' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: terraform plan -input=false -var-file="${{ inputs.tfvars_path }}" -out=tfplan

    - name: Terraform Apply
      if: ${{ inputs.tf_action == 'apply' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: terraform apply -input=false -auto-approve tfplan

    - name: Terraform Destroy
      if: ${{ inputs.tf_action == 'destroy' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: terraform destroy -input=false -auto-approve -var-file="${{ inputs.tfvars_path }}"
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform init -input=false

    - name: Terraform Plan
      if: ${{ inputs.tf_action == 'plan' || inputs.tf_action == 'apply' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform plan -input=false -var-file="${{ inputs.tfvars_path }}" -out=tfplan

    - name: Terraform Apply
      if: ${{ inputs.tf_action == 'apply' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform apply -input=false -auto-approve tfplan

    - name: Terraform Destroy
      if: ${{ inputs.tf_action == 'destroy' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terraform destroy -input=false -auto-approve -var-file="${{ inputs.tfvars_path }}"
