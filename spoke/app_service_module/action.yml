name: "spoke/app_service_module"
description: "Deploys an Azure App Service via the spoke Terraform module."

inputs:
  tfvars_path:
    description: "Path (in the calling spoke repo) to the terraform.tfvars for this module/environment."
    required: true
  environment:
    description: "nonprod or prod"
    required: true
  tf_action:
    description: "plan | apply | destroy"
    required: false
    default: "plan"
  working_directory:
    description: "Directory containing the terraform.tfvars for this module."
    required: true
  azure_client_id:
    required: true
  azure_tenant_id:
    required: true
  azure_subscription_id:
    required: true

runs:
  using: "composite"
  steps:
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Add backend block
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        cat > backend.tf <<'EOF'
        terraform {
          backend "azurerm" {}
        }
        EOF

    - name: Debug backend and identity
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        az account show --query "{tenant:tenantId, sub:id, user:user.name}" -o json
        az storage blob list --account-name sttfstate347nonprod --container-name appservice --auth-mode login -o table || true
        env | grep -o '^ARM_[A-Z_]*' || true

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ARM_USE_CLI: "true"
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: |
